<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="../" />
    <title>Color Jewel Admin</title>
    <link rel="stylesheet" href="./admin.css?v=20260616-2" />
</head>
<body>
    <script>
        const adminWindowParams = new URLSearchParams(window.location.search);
        if (adminWindowParams.get("adminWindow") !== "1") {
            adminWindowParams.set("adminWindow", "1");
            const nextSearch = adminWindowParams.toString();
            window.history.replaceState(
                null,
                "",
                `${window.location.pathname}${nextSearch ? `?${nextSearch}` : ""}${window.location.hash}`
            );
        }
    </script>
    <script src="./admin-runtime.js?v=20260616-10"></script>
    <script src="./admin.js?v=20260616-10"></script>
    <script>
        void bootStandalonePixelAdmin();
    </script>
</body>
</html>
