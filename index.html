<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script>
        const bootParams = new URLSearchParams(window.location.search);
        const bootPath = window.location.pathname.replace(/\/+$/, "") || "/";
        const bootHash = window.location.hash || "";
        if (bootPath === "/a") {
            window.location.replace(`/a/${window.location.search}${bootHash}`);
        } else if (bootParams.get("adminWindow") === "1" && !bootPath.startsWith("/a")) {
            const nextSearch = bootParams.toString();
            window.location.replace(`/a/${nextSearch ? `?${nextSearch}` : ""}${bootHash}`);
        }
    </script>
    <title>Jewel Pocket Puzzle</title>
    <link rel="stylesheet" href="./game.css?v=20260623-04">
</head>
<body>
    <main class="app">
        <section class="panel board-stage">
            <div class="tutorial-layer" id="tutorialLayer" aria-hidden="true"></div>
            <div class="mobile-map-cheats" role="group" aria-label="맵 이동 치트">
                <button class="mobile-map-cheat-button" id="restartFromFirstMapButton" type="button" aria-label="첫 맵부터 새로 시작">처음</button>
                <button class="mobile-map-cheat-button" id="mobilePrevMapCheat" type="button" aria-label="이전 맵으로 이동">이전</button>
                <button class="mobile-map-cheat-button" id="mobileNextMapCheat" type="button" aria-label="다음 맵으로 이동">다음</button>
            </div>
            <div class="board-wrap">
                <div class="board-panzoom" id="boardPanzoom">
                    <div class="board" id="board" aria-label="최대 30x30 퍼즐 보드"></div>
                </div>
            </div>

            <div id="sceneBottomUiMount"></div>

            <div class="setting-overlay" id="settingOverlay" aria-hidden="true">
                <div class="setting-scene-host" id="settingSceneMount" aria-hidden="true"></div>
            </div>

            <div class="stage-clear-overlay" id="stageClearOverlay" aria-hidden="true">
                <div class="stage-clear-scene-host" id="stageClearSceneMount" aria-hidden="true"></div>
            </div>

            <div class="item-reward-overlay" id="itemRewardOverlay" aria-hidden="true"></div>
        </section>

        <div class="title-loading-overlay" id="titleLoadingOverlay" aria-hidden="true">
            <div class="title-scene-host" id="titleSceneMount" aria-hidden="true"></div>
        </div>
    </main>



    <script src="./sound.js?v=20260623-04"></script>
    <script src="./game.js?v=20260623-07"></script>
</body>
</html>
